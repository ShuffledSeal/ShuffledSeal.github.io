    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d9a0"/><stop offset=".28" stop-color="#8d6d3f"/><stop offset=".55" stop-color="#d0ae6a"/><stop offset="1" stop-color="#574128"/></linearGradient>
